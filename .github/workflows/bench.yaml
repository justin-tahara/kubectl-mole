name: bench

# The growth gate re-measures mole's output on the default corpus and fails
# if any scenario grew beyond the committed results.csv threshold: silent
# output growth is a regression in the product's headline claim. It is the
# slowest job by far, so it only runs when a change could actually move
# mole's output — code, the harness, or the committed baselines.
on:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "bench/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".github/workflows/bench.yaml"
  pull_request:
    paths:
      - "cmd/**"
      - "internal/**"
      - "bench/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".github/workflows/bench.yaml"

permissions:
  contents: read

# A superseded PR push cancels its in-flight runs; main runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bench:
    runs-on: ubuntu-latest
    env:
      # Matches the local dev cluster; the M16 bake adds a version matrix.
      KIND_VERSION: v0.30.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # kubectl-status compiles from source (~90s of module downloads per
      # run); the binary is pinned via KSTATUS_VERSION in the Makefile, so
      # keying on the Makefile rebuilds it exactly when the pin moves.
      - uses: actions/cache@v4
        with:
          path: bin/kubectl-status
          key: kubectl-status-${{ runner.os }}-${{ hashFiles('Makefile') }}
      # The o200k_base tokenizer file downloads on first use.
      - uses: actions/cache@v4
        with:
          path: bench/.tiktoken-cache
          key: tiktoken-o200k-v1
      # go install rides the module proxy (retried, cached) instead of a
      # raw binary download, which has flaked on runner networks.
      - run: go install sigs.k8s.io/kind@${KIND_VERSION}
      - name: kind create cluster (retried)
        run: |
          for attempt in 1 2 3; do
            kind create cluster --name mole-bench --config bench/kind.yaml --wait 120s && exit 0
            echo "kind create cluster failed (attempt ${attempt})"
            kind delete cluster --name mole-bench || true
          done
          exit 1
      - run: make bench-check BENCH_KUBECONFIG="$HOME/.kube/config"
