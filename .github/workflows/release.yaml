name: release

on:
  push:
    tags: ["v*"]

permissions:
  # Create the GitHub release.
  contents: write
  # Push images to ghcr.io.
  packages: write
  # Keyless cosign signing via GitHub OIDC.
  id-token: write
  # Build-provenance attestations.
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Fine-grained PAT with contents write on homebrew-tap; the tap
      # update step is skipped while the secret is absent.
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # goreleaser derives the changelog from the full history.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # qemu + buildx: the linux/arm64 image builds on the amd64 runner.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      # syft generates the per-archive SBOMs goreleaser attaches.
      - uses: anchore/sbom-action/download-syft@v0
      # The six cross-compiles are ~80% of the pipeline (~350s cold).
      # Restore-only: caches saved by a tag run are visible ONLY to that
      # same tag — never to future tags — so saving here would build a
      # 1.2GiB orphan per release (v0.2.2 did; v0.3.0 provably could not
      # see it). The cache is seeded from main by release-cache.yaml,
      # and main-saved caches are restorable from every ref.
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/go-build
          key: release-gobuild-${{ hashFiles('go.mod', 'go.sum') }}-main
          restore-keys: |
            release-gobuild-${{ hashFiles('go.mod', 'go.sum') }}-
            release-gobuild-
      # scripts/goreleaser.sh: pinned, checksum-verified, retried — the
      # action's un-retried binary download cost the v0.2.0 release a rerun.
      - name: goreleaser release
        run: ./scripts/goreleaser.sh release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Provenance for every artifact listed in checksums.txt; verify with
      # `gh attestation verify <file> --repo justin-tahara/kubectl-mole`.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: dist/checksums.txt
      # Regenerates the Homebrew tap formula from this release's checksums.
      - name: Update Homebrew tap formula
        id: tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        run: ./scripts/update-tap-formula.sh "$GITHUB_REF_NAME"
      # Opens a version-bump PR against krew-index from the .krew.yaml
      # template. Gated until the plugin is accepted there: while the
      # initial submission is under review, every release's bump PR is
      # auto-closed noise on krew-index. Flip the KREW_INDEX_ACCEPTED
      # repository variable to 'true' once the submission merges.
      - uses: rajatjindal/krew-release-bot@v0.0.51
        id: krew
        if: vars.KREW_INDEX_ACCEPTED == 'true'
        continue-on-error: true
      # By the time distribution runs the binaries are already published, so
      # a channel that skips or fails must not retroactively fail the
      # release — but it must not pass unnoticed either, and both channels
      # were silent before. The tap step simply vanishes without its secret,
      # and the krew bot is continue-on-error, so a template, token or
      # webhook fault would leave users pinned to the previous version
      # behind a green tick. Neither is fixed by failing the job; both are
      # fixed by saying so where a human looks after tagging.
      - name: Distribution summary
        if: always()
        env:
          TAP: ${{ steps.tap.outcome || 'skipped' }}
          KREW: ${{ steps.krew.outcome || 'skipped' }}
        run: |
          {
            echo "### Distribution channels"
            echo
            echo "| Channel | Outcome |"
            echo "|---|---|"
            echo "| Homebrew tap | \`$TAP\` |"
            echo "| krew-index | \`$KREW\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$TAP" != success ]; then
            echo "::warning title=Homebrew tap not updated::outcome '$TAP' — brew users stay on the previous version. Set the HOMEBREW_TAP_TOKEN secret (issue #53), or run scripts/update-tap-formula.sh $GITHUB_REF_NAME by hand."
          fi
          if [ "$KREW" != success ]; then
            echo "::warning title=krew-index not bumped::outcome '$KREW' — krew users stay on the previous version. Check the krew-release-bot step and the KREW_INDEX_ACCEPTED variable (issue #52)."
          fi
