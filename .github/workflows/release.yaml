name: release

on:
  push:
    tags: ["v*"]

permissions:
  # Create the GitHub release.
  contents: write
  # Push images to ghcr.io.
  packages: write
  # Keyless cosign signing via GitHub OIDC.
  id-token: write
  # Build-provenance attestations.
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Fine-grained PAT with contents write on homebrew-tap; the tap
      # update step is skipped while the secret is absent.
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # goreleaser derives the changelog from the full history.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # qemu + buildx: the linux/arm64 image builds on the amd64 runner.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      # syft generates the per-archive SBOMs goreleaser attaches.
      - uses: anchore/sbom-action/download-syft@v0
      # The six cross-compiles are ~80% of the pipeline (~350s cold), and
      # setup-go's cache key is shared with CI, which only ever saves
      # linux/amd64 artifacts. A release-scoped build cache turns repeat
      # releases on unchanged deps into relinks.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: release-gobuild-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.ref_name }}
          restore-keys: |
            release-gobuild-${{ hashFiles('go.mod', 'go.sum') }}-
            release-gobuild-
      # scripts/goreleaser.sh: pinned, checksum-verified, retried — the
      # action's un-retried binary download cost the v0.2.0 release a rerun.
      - name: goreleaser release
        run: ./scripts/goreleaser.sh release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Provenance for every artifact listed in checksums.txt; verify with
      # `gh attestation verify <file> --repo justin-tahara/kubectl-mole`.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: dist/checksums.txt
      # Regenerates the Homebrew tap formula from this release's checksums.
      - name: Update Homebrew tap formula
        if: env.HOMEBREW_TAP_TOKEN != ''
        run: ./scripts/update-tap-formula.sh "$GITHUB_REF_NAME"
      # Opens a version-bump PR against krew-index from the .krew.yaml
      # template. Only works once mole is in the index (first submission is
      # manual), so a failure here must not fail the release.
      - uses: rajatjindal/krew-release-bot@v0.0.51
        continue-on-error: true
