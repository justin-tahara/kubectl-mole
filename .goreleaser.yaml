# Signing, SBOM, and provenance land at M9 (see DESIGN.md).
version: 2

project_name: kubectl-mole

builds:
  - main: ./cmd/kubectl-mole
    binary: kubectl-mole
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  use: github
