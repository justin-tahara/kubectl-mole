# The single source of truth for mole's krew-index entry: on each release
# krew-release-bot fills in the tag and artifact digests and opens a
# version-bump PR against krew-index. The initial submission was manual and
# is done (kubernetes-sigs/krew-index#6190); nothing here is hand-edited.
apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: mole
spec:
  version: {{ .TagName }}
  homepage: https://github.com/justin-tahara/kubectl-mole
  shortDescription: Watch workloads settle and explain what broke
  description: |
    mole watches Kubernetes workloads until they settle, then emits one
    deterministic structured verdict: what happened, why it failed
    (signature, cause, ownership chain, evidence), and a meaningful exit
    code (0 settled, 1 failed, 2 still progressing, 3 permission denied,
    4 nothing matched; with --since, 5 means something changed and it is
    settled now). With no TYPE/NAME argument it fans out over every
    Deployment, StatefulSet, and DaemonSet in scope and returns one verdict
    for the whole fleet. Read-only, no LLM, informer-based.
  caveats: |
    mole needs read access to workloads, pods, and events. A minimal
    ClusterRole ships with the repo:
    https://github.com/justin-tahara/kubectl-mole/blob/main/deploy/rbac.yaml
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    {{addURIAndSha "https://github.com/justin-tahara/kubectl-mole/releases/download/{{ .TagName }}/kubectl-mole_{{ .TagName }}_linux_amd64.tar.gz" .TagName }}
    bin: kubectl-mole
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    {{addURIAndSha "https://github.com/justin-tahara/kubectl-mole/releases/download/{{ .TagName }}/kubectl-mole_{{ .TagName }}_linux_arm64.tar.gz" .TagName }}
    bin: kubectl-mole
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    {{addURIAndSha "https://github.com/justin-tahara/kubectl-mole/releases/download/{{ .TagName }}/kubectl-mole_{{ .TagName }}_darwin_amd64.tar.gz" .TagName }}
    bin: kubectl-mole
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    {{addURIAndSha "https://github.com/justin-tahara/kubectl-mole/releases/download/{{ .TagName }}/kubectl-mole_{{ .TagName }}_darwin_arm64.tar.gz" .TagName }}
    bin: kubectl-mole
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    {{addURIAndSha "https://github.com/justin-tahara/kubectl-mole/releases/download/{{ .TagName }}/kubectl-mole_{{ .TagName }}_windows_amd64.zip" .TagName }}
    bin: kubectl-mole.exe
  - selector:
      matchLabels:
        os: windows
        arch: arm64
    {{addURIAndSha "https://github.com/justin-tahara/kubectl-mole/releases/download/{{ .TagName }}/kubectl-mole_{{ .TagName }}_windows_arm64.zip" .TagName }}
    bin: kubectl-mole.exe
