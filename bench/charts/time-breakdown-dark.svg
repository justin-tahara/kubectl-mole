<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250" role="img"><rect width="880" height="250" rx="8" fill="#1a1a19"/><text x="24.0" y="30.0" fill="#ffffff" font-size="15" font-weight="600" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">Where mole's time goes (median failure scenario)</text><text x="24.0" y="50.0" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">the wall clock is not tool cost — it is the deliberate wait for settle evidence</text><rect x="24.0" y="108.0" width="3.0" height="24" fill="#3987e5"/><path d="M29.0 108.0 h823.0 a4.0 4.0 0 0 1 4.0 4.0 v16.0 a4.0 4.0 0 0 1 -4.0 4.0 h-823.0 z" fill="#86b6ef"/><line x1="25.5" y1="104.0" x2="25.5" y2="92.0" stroke="#898781" stroke-width="1"/><text x="31.5" y="88.0" fill="#ffffff" font-size="12" font-weight="600" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">tool overhead: 48 ms (0.2%)</text><text x="440.0" y="124.0" fill="#0b0b0b" font-size="12" font-weight="600" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">evidence window: 25.4 s (99.8%)</text><text x="24.0" y="154.0" fill="#898781" font-size="11" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">0 s</text><text x="856.0" y="154.0" fill="#898781" font-size="11" font-weight="400" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">25.5 s</text><text x="24.0" y="190.0" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">Across every failure scenario the overhead is 18–374 ms — at most 1.5% of the wall. The snapshot</text><text x="24.0" y="208.0" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">baselines are timed after the failure is already steady; the wait that got the operator there is unmeasured.</text></svg>
