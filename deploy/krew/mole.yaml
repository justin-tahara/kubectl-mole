# The krew manifest for the initial krew-index submission (copy to
# plugins/mole.yaml in a krew-index fork). After the plugin is accepted,
# krew-release-bot keeps the index current from .krew.yaml on each release.
apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: mole
spec:
  version: v0.1.0
  homepage: https://github.com/justin-tahara/kubectl-mole
  shortDescription: Watch workloads settle and explain what broke
  description: |
    mole watches Kubernetes workloads until they settle, then emits one
    deterministic structured verdict: what happened, why it failed
    (signature, cause, ownership chain, evidence), and a meaningful exit
    code (0 settled, 1 failed, 2 still progressing, 3 permission denied,
    4 nothing matched). With no TYPE/NAME argument it fans out over every
    Deployment, StatefulSet, and DaemonSet in scope and returns one verdict
    for the whole fleet. Read-only, no LLM, informer-based.
  caveats: |
    mole needs read access to workloads, pods, and events. A minimal
    ClusterRole ships with the repo:
    https://github.com/justin-tahara/kubectl-mole/blob/main/deploy/rbac.yaml
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/justin-tahara/kubectl-mole/releases/download/v0.1.0/kubectl-mole_v0.1.0_linux_amd64.tar.gz
    sha256: 52ae8dec9b8d39eae9d943e432fa8ee66a06d32966214e16da78462b235b8467
    bin: kubectl-mole
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/justin-tahara/kubectl-mole/releases/download/v0.1.0/kubectl-mole_v0.1.0_linux_arm64.tar.gz
    sha256: a422a6e176f677e9050c6f2caf36926c325550fb5143dcab6af073c662686d48
    bin: kubectl-mole
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/justin-tahara/kubectl-mole/releases/download/v0.1.0/kubectl-mole_v0.1.0_darwin_amd64.tar.gz
    sha256: 40a6eeb3c6bb4a95b1190d97e58e070c11b176f5f626b131c79c92a4308ec644
    bin: kubectl-mole
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/justin-tahara/kubectl-mole/releases/download/v0.1.0/kubectl-mole_v0.1.0_darwin_arm64.tar.gz
    sha256: dbd067f307034896c795a57398bcbda0979c848215ba75c8d10ceefa291a48ce
    bin: kubectl-mole
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/justin-tahara/kubectl-mole/releases/download/v0.1.0/kubectl-mole_v0.1.0_windows_amd64.zip
    sha256: 6fc2f340fcbb58528120331b841ed9792b6e4d8834226dccddcd2eda362605b8
    bin: kubectl-mole.exe
  - selector:
      matchLabels:
        os: windows
        arch: arm64
    uri: https://github.com/justin-tahara/kubectl-mole/releases/download/v0.1.0/kubectl-mole_v0.1.0_windows_arm64.zip
    sha256: 14eb04346e1175ccda183d0e926d2a81806b51e2b492100b8eebc517f5131da9
    bin: kubectl-mole.exe
